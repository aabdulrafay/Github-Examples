name: "Module 4 - Secrets Variables and GITHUB_TOKEN"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  secure-data-and-token-demo:
    name: "Safe Secrets and Token Authentication"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Log Repository Variables Safely"
        run: |
          echo "=============================================="
          echo "=== CONFIGURATION VARIABLES (vars) ==="
          echo "Repository Variable vars.APP_ENV: ${{ vars.APP_ENV }}"
          echo "Environment Type: ${{ vars.APP_ENV }}"
          echo "=============================================="

      - name: "Access Encrypted Secrets and Verify Masking"
        run: |
          echo "=============================================="
          echo "=== ENCRYPTED SECRETS (secrets) ==="
          echo "Attempting to echo secrets.MY_SECRET directly into log:"
          echo "Value of secrets.MY_SECRET: ${{ secrets.MY_SECRET }}"
          echo "=============================================="
        env:
          INJECTED_SECRET: ${{ secrets.MY_SECRET }}

      - name: "Verify Masking in Environment Variables"
        run: |
          echo "Verifying secret injected via environment variable is masked in log:"
          echo "Environment Variable Value: $INJECTED_SECRET"
        env:
          INJECTED_SECRET: ${{ secrets.MY_SECRET }}

      - name: "Authenticate REST API Calls with secrets.GITHUB_TOKEN"
        run: |
          echo "=============================================="
          echo "=== AUTOMATED REST API WITH GITHUB_TOKEN ==="
          echo "Querying repository metadata using auto-generated GITHUB_TOKEN..."
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/${{ github.repository }} | jq '{name: .name, full_name: .full_name, visibility: .visibility, default_branch: .default_branch}'
          echo "API authentication with secrets.GITHUB_TOKEN succeeded!"
          echo "=============================================="
