name: 'Hello World Custom Action'
description: 'A custom GitHub Action created for the certification course demonstration'
inputs:
  who-to-greet:
    description: 'Who to greet'
    required: true
    default: 'Abdul Rafay'
outputs:
  greeting:
    description: 'Greeting output message'
  time:
    description: 'The time when the action completed'
runs:
  using: 'node20'
  main: 'dist/index.js'
